<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Bot Serverless</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background: #121212; color: white; }
        .status { color: #00ff00; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🤖 Bot Telegram Daniel Aktif!</h1>
    <p>Status Server: <span class="status">ONLINE & RUNNING</span></p>
    <p>⚠️ PENTING: Biarkan tab website ini tetap terbuka di browser HP agar bot merespon.</p>

    <script type="module">
        const TELEGRAM_TOKEN = "8752862880:AAH0V_66etnuSVZ6nbuE2iDdsU6V-V-Hb1E";
        const GEMINI_API_KEY = "AQ.Ab8RN6Lbn27JFEsGK-7pllETF1yhaPNc1m2DiTBGw5tvkV4haw";

        let lastUpdateId = 0;

        async function periksaPesan() {
            try {
                const res = await fetch(`https://telegram.org{TELEGRAM_TOKEN}/getUpdates?offset=${lastUpdateId + 1}&timeout=10`);
                const data = await res.json();

                if (data.ok && data.result.length > 0) {
                    for (const update of data.result) {
                        lastUpdateId = update.update_id;
                        
                        if (update.message && update.message.text) {
                            const chatId = update.message.chat.id;
                            const pesanUser = update.message.text;

                            // Efek mengetik di Telegram
                            await fetch(`https://telegram.org{TELEGRAM_TOKEN}/sendChatAction?chat_id=${chatId}&action=typing`);

                            // Panggil Otak AI Gemini
                            const geminiRes = await fetch(`https://googleapis.com{GEMINI_API_KEY}`, {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ contents: [{ parts: [{ text: pesanUser }] }] })
                            });
                            
                            const geminiData = await geminiRes.json();
                            
                            // FIX: Cara membaca teks dari respon Gemini yang benar dan anti-crash
                            let jawabanAI = "Maaf ya, otak bot lagi nge-blank sebentar. Coba tanya lagi! 🙏";
                            if (geminiData.candidates && geminiData.candidates[0] && geminiData.candidates[0].content && geminiData.candidates[0].content.parts && geminiData.candidates[0].content.parts[0]) {
                                jawabanAI = geminiData.candidates[0].content.parts[0].text;
                            }

                            // Kirim jawaban balik ke Telegram
                            await fetch(`https://telegram.org{TELEGRAM_TOKEN}/sendMessage`, {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ chat_id: chatId, text: jawabanAI })
                            });
                        }
                    }
                }
            } catch (err) {
                console.error("Ada kendala:", err);
            }
            setTimeout(periksaPesan, 2000);
        }

        periksaPesan();
    </script>
</body>
</html>
