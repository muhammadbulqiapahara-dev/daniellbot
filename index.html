<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Bot Serverless</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background: #121212; color: white; }
        .log-box { background: #222; border: 1px solid #444; padding: 15px; width: 85%; margin: 20px auto; text-align: left; font-family: monospace; font-size: 11px; color: #0f0; max-height: 300px; overflow-y: auto; }
    </style>
</head>
<body>
    <h1>🤖 Bot Daniel (Mode Kunci AQ)</h1>
    <p>Status: <span style="color:#0f0">ONLINE</span></p>
    <div class="log-box" id="logBox">Menunggu chat...</div>

    <script type="module">
        const TELEGRAM_TOKEN = "8752862880:AAH0V_66etnuSVZ6nbuE2iDdsU6V-V-Hb1E";
        
        // PASTE KUNCI YANG AWALANNYA "AQ." DI SINI
        const GEMINI_API_KEY = "AQ.Ab8RN6IkeSnHHWef0SQXfP-2LJAyLMXr2vOF3hPhBLlKWaKRyw"; // Ganti dengan kunci AQ lengkap Abang

        let lastUpdateId = 0;
        const logBox = document.getElementById("logBox");

        function log(msg) {
            logBox.innerHTML += `<div>> ${msg}</div>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        async function startBot() {
            try {
                // Cek pesan Telegram
                const tgRes = await fetch(`https://telegram.org{TELEGRAM_TOKEN}/getUpdates?offset=${lastUpdateId + 1}&timeout=5`);
                const tgData = await tgRes.json();

                if (tgData.ok && tgData.result.length > 0) {
                    for (const update of tgData.result) {
                        lastUpdateId = update.update_id;
                        if (update.message && update.message.text) {
                            const chatId = update.message.chat.id;
                            const text = update.message.text;
                            log(`Chat masuk: ${text}`);

                            // Efek ngetik
                            fetch(`https://telegram.org{TELEGRAM_TOKEN}/sendChatAction?chat_id=${chatId}&action=typing`);

                            // --- BAGIAN INI DIUBAH KHUSUS UNTUK KUNCI AQ ---
                            // Kita pakai URL endpoint versi 'v1' bukan 'v1beta' agar lebih stabil dengan kunci AQ
                            const url = `https://googleapis.com{GEMINI_API_KEY}`;
                            
                            const geminiRes = await fetch(url, {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ contents: [{ parts: [{ text: text }] }] })
                            });

                            const geminiData = await geminiRes.json();
                            
                            if (geminiData.error) {
                                log(`ERROR GEMINI: ${geminiData.error.message}`);
                                // Kirim pesan error ke Telegram biar Abang tau
                                fetch(`https://telegram.org{TELEGRAM_TOKEN}/sendMessage`, {
                                    method: "POST", 
                                    headers: {"Content-Type": "application/json"},
                                    body: JSON.stringify({chat_id: chatId, text: `⚠️ Error Kunci: ${geminiData.error.message}`})
                                });
                                continue;
                            }

                            let reply = "Maaf, AI tidak menjawab.";
                            if (geminiData.candidates?.[0]?.content?.parts?.[0]?.text) {
                                reply = geminiData.candidates[0].content.parts[0].text;
                            }

                            // Kirim Balasan
                            await fetch(`https://telegram.org{TELEGRAM_TOKEN}/sendMessage`, {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ chat_id: chatId, text: reply })
                            });
                            log("Balasan terkirim!");
                        }
                    }
                }
            } catch (e) {
                console.error(e);
            }
            setTimeout(startBot, 2000);
        }

        startBot();
    </script>
</body>
</html>
