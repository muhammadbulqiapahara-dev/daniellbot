<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Bot Serverless</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background: #121212; color: white; }
        .status { color: #00ff00; font-weight: bold; }
        .log-box { background: #222; border: 1px solid #444; padding: 15px; width: 85%; margin: 20px auto; text-align: left; font-family: monospace; font-size: 12px; color: #00ff00; max-height: 250px; overflow-y: auto; }
    </style>
</head>
<body>
    <h1>🤖 Bot Telegram Daniel Aktif!</h1>
    <p>Status Server: <span class="status">ONLINE & RUNNING</span></p>
    <p>⚠️ PENTING: Jangan tutup tab ini di HP agar bot terus merespon.</p>
    
    <div class="log-box" id="logBox">Sistem dimulai... Menunggu chat.</div>

    <script type="module">
        const TELEGRAM_TOKEN = "8752862880:AAH0V_66etnuSVZ6nbuE2iDdsU6V-V-Hb1E";
        // 🔑 Kunci asli abang sudah tertanam sempurna di bawah ini
        const GEMINI_API_KEY = "AQ.Ab8RN6IkeSnHHWef0SQXfP-2LJAyLMXr2vOF3hPhBLlKWaKRyw"; 

        let lastUpdateId = 0;
        const logBox = document.getElementById("logBox");

        function cetakLog(teks) {
            logBox.innerHTML += "<div>> " + teks + "</div>";
            logBox.scrollTop = logBox.scrollHeight;
        }

        async function periksaPesan() {
            try {
                const res = await fetch(`https://telegram.org{TELEGRAM_TOKEN}/getUpdates?offset=${lastUpdateId + 1}&timeout=5`);
                const data = await res.json();

                if (data.ok && data.result.length > 0) {
                    for (const update of data.result) {
                        lastUpdateId = update.update_id;
                        
                        if (update.message && update.message.text) {
                            const chatId = update.message.chat.id;
                            const pesanUser = update.message.text;
                            cetakLog(`Menerima chat: "${pesanUser}"`);

                            // Efek mengetik di Telegram
                            fetch(`https://telegram.org{TELEGRAM_TOKEN}/sendChatAction?chat_id=${chatId}&action=typing`);

                            // Memanggil Gemini AI model 2.5 Flash yang mendukung Kunci AQ
                            cetakLog("Memanggil Gemini AI (Model 2.5-Flash)...");
                            const geminiRes = await fetch(`https://googleapis.com{GEMINI_API_KEY}`, {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({
                                    contents: [{ parts: [{ text: pesanUser }] }]
                                })
                            });
                            
                            const geminiData = await geminiRes.json();
                            
                            if (geminiData.error) {
                                cetakLog(`ERROR GOOGLE: ${geminiData.error.message}`);
                                continue;
                            }

                            let jawabanAI = "Maaf, otak bot sedang blank.";
                            if (geminiData.candidates && geminiData.candidates[0] && geminiData.candidates[0].content && geminiData.candidates[0].content.parts && geminiData.candidates[0].content.parts[0]) {
                                jawabanAI = geminiData.candidates[0].content.parts[0].text;
                            }

                            // Kirim balik ke Telegram
                            cetakLog("Mengirim balasan ke Telegram...");
                            await fetch(`https://telegram.org{TELEGRAM_TOKEN}/sendMessage`, {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ chat_id: chatId, text: jawabanAI })
                            });
                            cetakLog("Sukses membalas chat!");
                        }
                    }
                }
            } catch (err) {
                cetakLog(`Kendala sistem: ${err.message}`);
            }
            setTimeout(periksaPesan, 2000);
        }

        periksaPesan();
    </script>
</body>
</html>
